<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Yogic Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-responsive.css') }}">
    <style>
        /* Enhanced dropdown styling */
        select {
            color: #374151 !important;
            background-color: #ffffff !important;
        }

        select option {
            background-color: #ffffff !important;
            color: #374151 !important;
            padding: 10px !important;
        }

        select option:hover {
            background-color: #eef2ff !important;
            color: #4f46e5 !important;
        }

        select option:checked {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
        }

        /* Custom dropdown arrow */
        select::-ms-expand {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">
    <div class="flex items-center justify-center min-h-screen p-3 sm:p-6">
        <div class="bg-white p-4 sm:p-8 md:p-12 rounded-2xl shadow-lg w-full max-w-2xl">
            <!-- Logo and Back Button -->
            <div class="flex justify-between items-center mb-6 sm:mb-8">
                <a href="{{ url_for('index') }}"
                    class="text-sm sm:text-base text-gray-600 hover:text-indigo-600 transition">
                    ← Back to Home
                </a>
            </div>

            <div class="text-center mb-6 sm:mb-8">
                <div class="text-4xl sm:text-5xl md:text-6xl mb-3 sm:mb-4">🧘</div>
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-indigo-600 mb-2">
                    Start Your Journey
                </h1>
                <p class="text-sm sm:text-base text-gray-600">Create your free account in seconds</p>
            </div>

            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded mb-6 shake">
                <p class="font-semibold">{{ error }}</p>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}" class="space-y-4 sm:space-y-6"></form>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                <div>
                    <label class="block text-gray-700 text-xs sm:text-sm font-bold mb-2">Full Name</label>
                    <input type="text" name="name" required
                        class="w-full px-3 sm:px-4 py-2 sm:py-3 text-base border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 transition"
                        placeholder="John Doe">
                </div>

                <div>
                    <label class="block text-gray-700 text-xs sm:text-sm font-bold mb-2">Age</label>
                    <input type="number" name="age" required min="10" max="100"
                        class="w-full px-3 sm:px-4 py-2 sm:py-3 text-base border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 transition"
                        placeholder="25">
                </div>
            </div>

            <div>
                <label class="block text-gray-700 text-xs sm:text-sm font-bold mb-2">Email Address</label>
                <input type="email" name="email" required
                    class="w-full px-3 sm:px-4 py-2 sm:py-3 text-base border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 transition"
                    placeholder="your@email.com">
            </div>

            <div>
                <label class="block text-gray-700 text-xs sm:text-sm font-bold mb-2">Password</label>
                <input type="password" name="password" required minlength="6"
                    class="w-full px-3 sm:px-4 py-2 sm:py-3 text-base border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 transition"
                    placeholder="••••••••">
                <p class="text-xs text-gray-500 mt-1">Minimum 6 characters</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                <div>
                    <label class="block text-gray-700 text-xs sm:text-sm font-bold mb-2">Gender (Optional)</label>
                    <select name="gender"
                        class="w-full px-3 sm:px-4 py-2 sm:py-3 text-base text-gray-700 bg-white border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 transition appearance-none cursor-pointer"
                        style="background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27currentColor%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3e%3cpolyline points=%276 9 12 15 18 9%27%3e%3c/polyline%3e%3c/svg%3e'); background-repeat: no-repeat; background-position: right 0.5rem center; background-size: 1.5em 1.5em; padding-right: 2.5rem;">
                        <option value="" class="bg-white text-gray-700">Prefer not to say</option>
                        <option value="Male" class="bg-white text-gray-700">Male</option>
                        <option value="Female" class="bg-white text-gray-700">Female</option>
                        <option value="Other" class="bg-white text-gray-700">Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 text-xs sm:text-sm font-bold mb-2">Experience Level</label>
                    <select name="experience"
                        class="w-full px-3 sm:px-4 py-2 sm:py-3 text-base text-gray-700 bg-white border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 transition appearance-none cursor-pointer"
                        style="background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27currentColor%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3e%3cpolyline points=%276 9 12 15 18 9%27%3e%3c/polyline%3e%3c/svg%3e'); background-repeat: no-repeat; background-position: right 0.5rem center; background-size: 1.5em 1.5em; padding-right: 2.5rem;">
                        <option value="Beginner" class="bg-white text-gray-700">🌱 Beginner</option>
                        <option value="Intermediate" class="bg-white text-gray-700">🌿 Intermediate</option>
                        <option value="Advanced" class="bg-white text-gray-700">🌳 Advanced</option>
                    </select>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white py-3 sm:py-4 rounded-lg font-bold text-base sm:text-lg hover:bg-indigo-700 hover:shadow-lg transition"></button>
            Create Account
            </button>
            </form>

            <div class="mt-6 sm:mt-8 text-center space-y-3">
                <p class="text-sm sm:text-base text-gray-600"></p>
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-indigo-600 hover:text-indigo-700 font-bold transition">
                    Sign In
                </a>
                </p>
                <div class="border-t border-gray-200 pt-3">
                    <p class="text-xs sm:text-sm text-gray-500 mb-2">Administrator?</p>
                    <a href="{{ url_for('admin_login') }}"
                        class="inline-flex items-center space-x-2 text-purple-600 hover:text-purple-700 font-medium transition text-sm sm:text-base">
                        <span>👑</span>
                        <span>Admin Login</span>
                    </a>
                </div>
            </div>

            <div class="mt-6 sm:mt-8 pt-6 sm:pt-8 border-t border-gray-200">
                <div
                    class="flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4 text-xs sm:text-sm text-gray-500">
                    <span>✓ Free Forever</span>
                    <span class="hidden sm:inline">•</span>
                    <span>✓ No Credit Card</span>
                    <span class="hidden sm:inline">•</span>
                    <span>✓ Instant Access</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
