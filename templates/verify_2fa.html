<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - Yogic Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="flex items-center justify-center min-h-screen p-6">
        <div class="bg-white p-8 md:p-12 rounded-2xl shadow-lg w-full max-w-md">
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">🔐</div>
                <h1 class="text-3xl font-bold text-indigo-600 mb-2">Two-Factor Authentication</h1>
                <p class="text-gray-600">Enter the 6-digit code from your authenticator app</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-4 rounded-lg {% if category == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST" class="space-y-6">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Authentication Code</label>
                    <input type="text" name="token" required maxlength="6" 
                        class="form-input text-center text-2xl tracking-widest"
                        placeholder="000000" autocomplete="off">
                </div>
                
                <button type="submit" class="btn-primary w-full">
                    Verify & Login
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="{{ url_for('login') }}" class="text-gray-600 hover:text-indigo-600 text-sm">
                    ← Back to Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
